<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Hotel Aurea</title>
</head>
<body>

<header>
    <h1>HOTEL AUREA</h1>
    <p>Panel de administración</p>
</header>

<main>
    <h2>Iniciar sesión</h2>
    <p>Ingresa tus datos para acceder al sistema del hotel.</p>

<form action="#" method="post">
    <div>
        <label for="correo">Correo electrónico</label>
        <input
            type="email"
            id="correo"
            name="correo"
            placeholder="nombre@hotelaurea.com"
            required>
    </div>

    <div>
        <label for="contrasena">Contraseña</label>
        <input
            type="password"
            id="contrasena"
            name="contrasena"
            placeholder="Ingresa tu contraseña"
            required>
    </div>

    <div>
        <input type="checkbox" id="recordarme" name="recordarme">
        <label for="recordarme">Recordarme</label>
    </div>

    <button type="submit">Entrar al panel</button>
    </form>

    <p>
        <a href="mailto:administracion@hotelaurea.com?subject=Recuperar%20contrase%C3%B1a">
        ¿Olvidaste tu contraseña?
        </a>
    </p>

    <footer>
        <p>Acceso exclusivo para personal autorizado</p>
    </footer>
</main>
</body>
</html>
